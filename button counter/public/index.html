<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Richlands East State School Eagle Shop</title>

<style>
  body {
    font-family: Roboto, sans-serif;
    padding: 20px;
    background: #fff;
  }

  /* ---------- TITLE ---------- */
  .title-container {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.5em;
    margin-bottom: 5px;
  }

  .title-container h1 {
    font-size: 2.5rem;
    margin: 0;
  }

  .title-img {
    height: 1em; /* same height as text */
    width: auto;
  }

  #current-week {
    text-align: center;
    font-size: 20px;
    margin-bottom: 20px;
  }

  /* ---------- GROUPS ---------- */
  .groups {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
    max-width: 900px;
    margin: 0 auto;
  }

  .group {
    border: 3px solid #333;
    background: #f2f2f2;
    padding: 16px;
    border-radius: 10px;
    text-align: center;
  }

  .group h2 {
    margin-bottom: 12px;
  }

  button {
    padding: 14px;
    margin: 5px;
    border: none;
    cursor: pointer;
    font-size: 16px;
    font-weight: 600;
    border-radius: 6px;
    color: white;
  }

  .yellow { background:#ffe078; color:#000; }
  .blue { background:#3498db; }
  .green { background:#2ecc71; }
  .orange { background:#f39c12; }
  .purple { background:#7c4dff; }
  .pink { background:#ffc5d3; color:#000; }
  .red { background:#e74c3c; }
  .pastelpurple { background:#C9A0DC; color:#000; }
  .background { background:#000080; }

  button:hover { opacity: 0.85; }
  button:active { border: 2px solid black; }

  @media (max-width:768px) {
    .groups { grid-template-columns: repeat(2,1fr); }
  }

  @media (max-width:480px) {
    .groups { grid-template-columns: 1fr; }
  }
</sty
