<!DOCTYPE html>
<html>
<head>
  <title>Richlands East State School Eagle Shop</title>
</head>
<body>
  <h1>Richlands East State School Eagle Shop</h1>

  <!DOCTYPE html>
<html>
<head>
  <style>
    body {
      font-family: Roboto, sans-serif;
      padding: 20px;
    }

    .group {
      margin-bottom: 20px;
    }

    .group h2 {
      margin-bottom: 10px;
    }

    button {
      padding: 16px;
      margin: 5px;
      border: none;
      cursor: pointer;
      font-size: 14px;
      border-radius: 6px;
      color: white;
    }

    /* COLORS */
    .blue { background-color: #3498db; }
    .green { background-color: #2ecc71; }
    .orange { background-color: #f39c12; }
    .red { background-color: #e74c3c; }
    .yellow { background-color: #ffe078; }
    .purple { background-color: #7c4dff; }
    .pink { background-color: #ffc5d3; }
    .grey { background-color: #808080; }

    button:hover {
      opacity: 0.85;
    }
  </style>
</head>
<body>

  <h1>Ticket Counter</h1>

  <div class="group">
    <h2>10</h2>
  <button class="red" onclick="clickButton('Ice Block')">Ice Block</button>
  <button class="red" onclick="clickButton('Sit with friend')">Sit with friend</button>
  <button class="red" onclick="clickButton('Stationery Pack')">Stationery Pack</button>
  <button class="red" onclick="clickButton('Tatoo')">Tatoo</button>
  </div>

  <div class="group">
    <h2>30</h2>
  <button class="orange" onclick="clickButton('Duty with a teacher ')">Duty with a teacher</button>
  <button class="orange" onclick="clickButton('Game with a friend')">Game with a friend</button>
  <button class="orange" onclick="clickButton('Special chair in class')">Special chair in class</button>
  </div>

  <div class="group">
    <h2>50</h2>
  <button class="yellow" onclick="clickButton('Notepad')">Notepad</button>
  <button class="yellow" onclick="clickButton('Lolly Bag')">Lolly Bag</button>
  <button class="yellow" onclick="clickButton('15 mins computer time')">15 mins computer time</button>
  <button class="yellow" onclick="clickButton('Morning tea with 3 friends')">Morning tea with 3 friends</button>
  </div>

  <div class="group">
    <h2>75</h2>
  <button class="green" onclick="clickButton('Handball')">Handball</button>
  <button class="green" onclick="clickButton('30 mins computer time')">30 mins computer time</button>
  <button class="green" onclick="clickButton('20 mins computer time with friend')">20 mins computer time with friend</button>
  </div>
  
  <div class="group">
    <h2>100</h2>
<button class="blue" onclick="clickButton('Lanyard')">Lanyard</button>
<button class="blue" onclick="clickButton('Free choice in class')">Free choice in class</button>
  </div>
  
  <div class="group">
    <h2>150</h2>
  <button class="purple" onclick="clickButton('BYO morning tea with teacher')">BYO morning tea with teacher</button>
  <button class="purple" onclick="clickButton('Pick a prize')">Pick a prize</button>
  <button class="purple" onclick="clickButton('Mentor in another class')">Mentor in another class</button>
  </div>

  <div class="group">
    <h2>250</h2>
  <button class="pink" onclick="clickButton('$2 tuckshop voucher')">$2 tuckshop voucher</button>
  <button class="pink" onclick="clickButton('250 badge')">250 badge</button>
  <button class="pink" onclick="clickButton('Free play for whole class')">Free play for whole class</button>
  </div>

  <div class="group">
    <h2>300</h2>
  <button class="grey" onclick="clickButton('Morning Tea with DP')">Morning Tea with DP</button>
  <button class="grey" onclick="clickButton('Dodgeball for whole class')">Dodgeball for whole class</button>
  </div>

  <div class="group">
    <h2>400</h2>
  <button onclick="clickButton('400 Badge')">400 Badge</button>
  <button onclick="clickButton('$3 tuckshop voucher')">$3 tuckshop voucher</button>

  </div>
  
  <script>
    async function clickButton(buttonId) {
      await fetch("/click", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ buttonId })
      });
    }
  </script>

</body>
</html>
