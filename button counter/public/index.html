<!DOCTYPE html>
<html>
<head>
  <title>Button Counter</title>
</head>
<body>
  <h1>Button Counter</h1>

  <button onclick="clickButton('Cunha')">Cunha</button>
  <button onclick="clickButton('Mbuemo')">Mbuemo</button>
  <button onclick="clickButton('Fernandes')">Fernandes</button>
  <button onclick="clickButton('Mount')">Mount</button>
  <button onclick="clickButton('Lammens')">Lammens</button>

  <script>
    async function clickButton(buttonId) {
      await fetch("/click", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ buttonId })
      });
    }
  </script>
</body>
</html>
