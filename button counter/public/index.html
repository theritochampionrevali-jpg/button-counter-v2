<!DOCTYPE html>
<html>
<head>
  <title>Button Counter</title>
</head>
<body>
  <h1>Button Counter</h1>

  <button onclick="clickButton('10:Ice Block')">10:Ice Block</button>
  <button onclick="clickButton('10:Sit with friend')">10:Sit with friend</button>
  <button onclick="clickButton('10:Stationery Pack')">10:Stationery Pack</button>
  <button onclick="clickButton('10:Tatoo')">10:Tatoo</button>
  <button onclick="clickButton('30:Duty with a teacher ')">30:Duty with a teacher</button>
  <button onclick="clickButton('30:Game with a friend')">30:Game with a friend</button>
  <button onclick="clickButton('30:Special chair in class')">30:Special chair in class</button>
  <button onclick="clickButton('50:Notepad')">50:Notepad</button>
  <button onclick="clickButton('50:Lolly Bag')">50:Lolly Bag</button>
  <button onclick="clickButton('50:15 mins computer time')">50:15 mins computer time</button>
  <button onclick="clickButton('50:Morning tea with 3 friends')">50:Morning tea with 3 friends</button>
  <button onclick="clickButton('75:Handball')">75:Handball</button>
  <button onclick="clickButton('75:30 mins computer time')">75:30 mins computer time</button>
  <button onclick="clickButton('75:20 mins computer time with friend')">75:20 mins computer time with friend</button>
  <button onclick="clickButton('100:Lanyard')">100:Lanyard</button>
  <button onclick="clickButton('100:Free choice in class')">100:Free choice in class</button>
  <button onclick="clickButton('150:BYO morning tea with teacher')">150:BYO morning tea with teacher</button>
  <button onclick="clickButton('150:Pick a prize')">150:Pick a prize</button>
  <button onclick="clickButton('150:Mentor in another class')">150:Mentor in another class</button>
  <button onclick="clickButton('250:$2 tuckshop voucher')">250:$2 tuckshop voucher</button>
  <button onclick="clickButton('250:250 badge')">250:250 badge</button>
  <button onclick="clickButton('250:Free play for whole class')">250:Free play for whole class</button>
  <button onclick="clickButton('300:Morning Tea with DP')">300:Morning Tea with DP</button>
  <button onclick="clickButton('300:Dodgeball for whole class')">300:Dodgeball for whole class</button>
  <button onclick="clickButton('400:400 Badge')">400:400 Badge</button>
  <button onclick="clickButton('400:$3 tuckshop voucher')">400:$3 tuckshop voucher</button>

  <script>
    async function clickButton(buttonId) {
      await fetch("/click", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ buttonId })
      });
    }
  </script>
</body>
</html>
