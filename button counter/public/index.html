<!DOCTYPE html>
<html>
<head>
  <title>Button Counter</title>
</head>
<body>
  <h1>Button Counter</h1>

  <button onclick="clickButton('Cunha')">Button 1</button>
  <button onclick="clickButton('Mbuemo')">Button 2</button>
  <button onclick="clickButton('Fernandes')">Button 3</button>
  <button onclick="clickButton('Mount')">Button 4</button>
  <button onclick="clickButton('Lammens')">Button 5</button>

  <script>
    async function clickButton(buttonId) {
      await fetch("/click", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ buttonId })
      });
    }
  </script>
</body>
</html>
