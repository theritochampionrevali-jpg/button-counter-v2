<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Eagle Shop Stats</title>

<!-- Load Roboto font -->
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

<!-- Load SheetJS library for Excel export -->
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<style>
  body { font-family: Roboto, sans-serif; padding:20px; }
  h1 { text-align:center; }

  .controls { text-align:center; margin-bottom:15px; }
  button { padding:8px 14px; margin:5px; cursor:pointer; font-weight:bold; }
  .reset { background:#f44336; color:white; border:none; }

  table { width:100%; border-collapse:collapse; }
  th, td { border:1px solid #ccc; padding:6px; text-align:center; }
  th { background:#eee; }
  .current-week { background:#fff59d; font-weight:bold; }
</style>
</head>

<body>

<h1>Eagle Shop Stats</h1>

<div class="controls">
  <button id="prev">⬅ Previous</button>
  <span id="week-label">Week 1</span>
  <button id="next">Next ➡</button><br>
  <button class="reset" id="reset">Reset ALL Data</button>
  <button id="export">💾 Export to Excel</button>
</div>

<table id="stats-table">
<thead>
<tr>
  <th>Group</th><th>Button</th>
  <th>W1</th><th>W2</th><th>W3</th><th>W4</th><th>W5</th>
  <th>W6</th><th>W7</th><th>W8</th><th>W9</th><th>W10</th>
  <th>Total</th>
</tr>
</thead>
<tbody id="table"></tbody>
</table>

<script>
document.addEventListener("DOMContentLoaded", function () {

const WEEKS = 10;

// ---------------- SAFE DATA LOAD ----------------
let dashboard = JSON.parse(localStorage.getItem("dashboard") || "{}");
let currentWeek = parseInt(localStorage.getItem("currentWeek")) || 1;

let initialStock = parseInt(localStorage.getItem("initialStock")) || 0;
let currentStock = parseInt(localStorage.getItem("currentStock")) || 0;
let stockHistory = JSON.parse(localStorage.getItem("stockHistory") || "[]");

// ---------------- SAFE ELEMENT GETTER ----------------
function safe(id) {
  return document.getElementById(id);
}

// ---------------- RENDER BUTTON TABLE ----------------
function render() {

  const tableBody = safe("table");
  if (!tableBody) return;

  tableBody.innerHTML = "";

  if (safe("week-label"))
    safe("week-label").textContent = `Week ${currentWeek}`;

  if (safe("current-stock"))
    safe("current-stock").textContent = currentStock;

  Object.entries(dashboard).forEach(([name, data]) => {

    if (!data.weeks) data.weeks = new Array(WEEKS).fill(0);

    const total = data.weeks.reduce((a, b) => a + b, 0);

    const row = document.createElement("tr");

    row.innerHTML = `
      <td>${data.group || ""}</td>
      <td>${name}</td>
      ${data.weeks.map((v, i) =>
        `<td class="${i === currentWeek - 1 ? 'current-week' : ''}">${v}</td>`
      ).join("")}
      <td>${total}</td>
    `;

    tableBody.appendChild(row);
  });

  renderStockHistory();
}

// ---------------- RENDER STOCK TABLE ----------------
function renderStockHistory() {

  const stockBody = safe("stock-body");
  if (!stockBody) return;

  stockBody.innerHTML = "";

  stockHistory.forEach(entry => {
    const row = document.createElement("tr");
    row.innerHTML = `
      <td>Week ${entry.week}</td>
      <td>${entry.used}</td>
      <td>${entry.before}</td>
      <td>${entry.after}</td>
    `;
    stockBody.appendChild(row);
  });
}

// ---------------- WEEK NAVIGATION ----------------
if (safe("prev"))
safe("prev").onclick = function () {
  if (currentWeek > 1) {
    currentWeek--;
    localStorage.setItem("currentWeek", currentWeek);
    render();
  }
};

if (safe("next"))
safe("next").onclick = function () {
  if (currentWeek < WEEKS) {
    currentWeek++;
    localStorage.setItem("currentWeek", currentWeek);
    render();
  }
};

// ---------------- SET STOCK ----------------
if (safe("set-stock"))
safe("set-stock").onclick = function () {

  const input = safe("initial-stock");
  if (!input) return;

  const value = parseInt(input.value);

  if (isNaN(value) || value <= 0) {
    alert("Enter valid stock amount");
    return;
  }

  initialStock = value;
  currentStock = value;

  localStorage.setItem("initialStock", initialStock);
  localStorage.setItem("currentStock", currentStock);

  render();
};

// ---------------- CLOSE WEEK ----------------
if (safe("calculate-stock"))
safe("calculate-stock").onclick = function () {

  let weeklyTotal = 0;

  Object.values(dashboard).forEach(data => {
    if (data.weeks && data.weeks[currentWeek - 1])
      weeklyTotal += data.weeks[currentWeek - 1];
  });

  if (weeklyTotal === 0) {
    alert("No clicks this week");
    return;
  }

  const stockBefore = currentStock;
  const stockAfter = currentStock - weeklyTotal;

  if (stockAfter < 0) {
    alert("Not enough stock");
    return;
  }

  currentStock = stockAfter;

  stockHistory.push({
    week: currentWeek,
    used: weeklyTotal,
    before: stockBefore,
    after: stockAfter
  });

  localStorage.setItem("currentStock", currentStock);
  localStorage.setItem("stockHistory", JSON.stringify(stockHistory));

  render();
};

// ---------------- RESET ----------------
if (safe("reset"))
safe("reset").onclick = function () {
  if (!confirm("Delete ALL data?")) return;

  localStorage.clear();
  dashboard = {};
  stockHistory = [];
  currentWeek = 1;
  currentStock = 0;

  localStorage.setItem("currentWeek", 1);

  render();
};

// ---------------- EXPORT ----------------
if (safe("export"))
safe("export").onclick = function () {

  const wb = XLSX.utils.book_new();

  if (safe("stats-table")) {
    const statsSheet = XLSX.utils.table_to_sheet(safe("stats-table"));
    XLSX.utils.book_append_sheet(wb, statsSheet, "Button Stats");
  }

  if (safe("stock-table")) {
    const stockSheet = XLSX.utils.table_to_sheet(safe("stock-table"));
    XLSX.utils.book_append_sheet(wb, stockSheet, "Stock History");
  }

  XLSX.writeFile(wb, "EagleShopStats.xlsx");
};

// ---------------- INITIAL RENDER ----------------
render();

});
</script>


</body>
</html>
