<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Button Stats</title>
  <style>
    body { font-family: Roboto, sans-serif; padding: 20px; }
    table { border-collapse: collapse; width: 300px; margin-bottom: 30px; }
    th, td { border: 1px solid #ccc; padding: 8px; }
    th { background: #eee; }
  </style>
</head>
<body>

  <h2>Button Clicks (Last 7 Days)</h2>
  <table>
    <thead>
      <tr>
        <th>Button</th>
        <th>Clicks</th>
      </tr>
    </thead>
    <tbody id="stats-week"></tbody>
  </table>

  <h2>Button Clicks (All Time)</h2>
  <table>
    <thead>
      <tr>
        <th>Button</th>
        <th>Clicks</th>
      </tr>
    </thead>
    <tbody id="stats-all"></tbody>
  </table>

  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      // WEEK STATS
      const weekRes = await fetch("/stats/week");
      const weekData = await weekRes.json();

      const weekBody = document.getElementById("stats-week");
      weekBody.innerHTML = "";

      weekData.forEach(row => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${row.button_id}</td>
          <td>${row.total}</td>
        `;
        weekBody.appendChild(tr);
      });

      // ALL-TIME STATS
      const allRes = await fetch("/stats/all");
      const allData = await allRes.json();

      const allBody = document.getElementById("stats-all");
      allBody.innerHTML = "";

      allData.forEach(row => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${row.button_id}</td>
          <td>${row.total}</td>
        `;
        allBody.appendChild(tr);
      });
    });
  </script>

</body>
</html>
