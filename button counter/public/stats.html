<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Eagle Shop Dashboard</title>
<style>
  body { font-family: Roboto, sans-serif; padding: 20px; }
  table { border-collapse: collapse; width: 100%; margin-bottom: 20px; }
  th, td { border: 1px solid #ccc; padding: 8px; text-align: center; }
  th { background: #eee; }
  .reset { background: #f44336; color: white; border: none; cursor: pointer; padding: 8px 12px; margin-bottom: 20px; }
</style>
</head>
<body>

<h1>Eagle Shop Button Stats Dashboard</h1>
<button class="reset" id="reset-btn">Reset Dashboard Data</button>

<table>
<thead>
  <tr>
    <th>Group</th>
    <th>Button</th>
    <th>Week 1</th>
    <th>Week 2</th>
    <th>Week 3</th>
    <th>Week 4</th>
    <th>Week 5</th>
    <th>Week 6</th>
    <th>Week 7</th>
    <th>Week 8</th>
    <th>Week 9</th>
    <th>Week 10</th>
    <th>Total</th>
  </tr>
</thead>
<tbody id="stats-table"></tbody>
</table>

<script>
<script>
const WEEKS = 10;

/* 🔒 AUTHORITATIVE BUTTON → GROUP MAP */
const buttonGroups = {
  "Ice Block": "10",
  "Sit with friend": "10",
  "Stationery Pack": "10",
  "Tattoo": "10",

  "Duty with a teacher": "30",
  "Game with a friend": "30",
  "Special chair in class": "30",

  "Notepad": "50",
  "Lolly Bag": "50",
  "15 mins computer time": "50",
  "Morning tea with 3 friends": "50",

  "Handball": "75",
  "30 mins computer time": "75",
  "20 mins computer time with friend": "75",

  "Lanyard": "100",
  "Free choice in class": "100",

  "BYO morning tea with teacher": "150",
  "Pick a prize": "150",
  "Mentor in another class": "150",

  "$2 tuckshop voucher": "250",
  "250 badge": "250",
  "Free play for whole class": "250",

  "Morning Tea with DP": "300",
  "Dodgeball for whole class": "300",

  "400 Badge": "400",
  "$3 tuckshop voucher": "400"
};

/* Load stored dashboard */
let dashboard = JSON.parse(localStorage.getItem("dashboard")) || {};

/* Ensure structure exists */
function initButton(button) {
  if (!dashboard[button]) {
    dashboard[button] = {
      group: buttonGroups[button],
      weeks: Array(WEEKS).fill(0)
    };
  }
}

/* Fetch CURRENT WEEK stats */
async function fetchStats() {
  const res = await fetch("/stats/week");
  const data = await res.json();

  data.forEach(row => {
    const button = row.button_id;
    const total = row.total;

    if (!buttonGroups[button]) return;

    initButton(button);
    dashboard[button].weeks[0] = total; // current week
  });

  localStorage.setItem("dashboard", JSON.stringify(dashboard));
  renderTable();
}

/* Render table */
function renderTable() {
  const tbody = document.getElementById("stats-table");
  tbody.innerHTML = "";

  Object.entries(dashboard)
    .sort((a,b) => a[1].group.localeCompare(b[1].group))
    .forEach(([button, data]) => {
      const total = data.weeks.reduce((a,b)=>a+b,0);
      const row = document.createElement("tr");

      row.innerHTML = `
        <td>${data.group}</td>
        <td>${button}</td>
        ${data.weeks.map(v => `<td>${v}</td>`).join("")}
        <td>${total}</td>
      `;
      tbody.appendChild(row);
    });
}

/* Reset with confirmation */
document.getElementById("reset-btn").onclick = () => {
  if (confirm("Are you SURE you want to reset all dashboard data?")) {
    localStorage.removeItem("dashboard");
    dashboard = {};
    renderTable();
  }
};

/* Initial load */
fetchStats();
</script>

</script>

</body>
</html>
