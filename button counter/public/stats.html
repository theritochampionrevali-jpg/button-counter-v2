<!DOCTYPE html>
<html>
<head>
  <title>Button Stats - Eagle Shop</title>
  <style>
    body {
      font-family: Roboto, sans-serif;
      padding: 20px;
      background-color: #f7f7f7;
    }

    h1 {
      text-align: center;
      margin-bottom: 30px;
    }

    /* Table styling */
    table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 30px;
      background-color: #fff;
    }

    th, td {
      border: 1px solid #333;
      padding: 8px 12px;
      text-align: center;
    }

    th {
      background-color: #444;
      color: white;
      position: sticky;
      top: 0;
    }

    td.group-name {
      font-weight: bold;
      background-color: #f2f2f2;
    }

    td.button-name {
      text-align: left;
      padding-left: 12px;
    }

    tfoot td {
      font-weight: bold;
      background-color: #eee;
    }

    button.reset {
      padding: 10px 16px;
      background-color: #e74c3c;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }

    button.reset:hover {
      opacity: 0.85;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      overflow-x: auto;
    }
  </style>
</head>
<body>

  <h1>Weekly Button Stats - Eagle Shop</h1>

  <div class="container">
    <table id="statsTable">
      <thead>
        <tr>
          <th>Group</th>
          <th>Button</th>
          <th>Week 1</th>
          <th>Week 2</th>
          <th>Week 3</th>
          <th>Week 4</th>
          <th>Week 5</th>
          <th>Week 6</th>
          <th>Week 7</th>
          <th>Week 8</th>
          <th>Week 9</th>
          <th>Week 10</th>
          <th>Total</th>
        </tr>
      </thead>
      <tbody id="statsBody">
        <!-- Populated dynamically -->
      </tbody>
    </table>

    <button class="reset" onclick="resetData()">HARD RESET</button>
  </div>

  <script>
    // Fetch stats data from backend and populate table
    async function loadStats() {
      try {
        const response = await fetch("/stats"); // your backend endpoint
        if (!response.ok) throw new Error("Failed to fetch stats");
        const statsData = await response.json();
        populateTable(statsData);
      } catch (err) {
        console.error(err);
        alert("Failed to load stats data");
      }
    }

    // Populate table with stats
    function populateTable(statsData) {
      const tbody = document.getElementById("statsBody");
      tbody.innerHTML = "";

      statsData.forEach(groupData => {
        groupData.buttons.forEach(buttonData => {
          const tr = document.createElement("tr");

          const groupTd = document.createElement("td");
          groupTd.classList.add("group-name");
          groupTd.textContent = groupData.group;
          tr.appendChild(groupTd);

          const buttonTd = document.createElement("td");
          buttonTd.classList.add("button-name");
          buttonTd.textContent = buttonData.name;
          tr.appendChild(buttonTd);

          let total = 0;
          buttonData.weekly.forEach(count => {
            const td = document.createElement("td");
            td.textContent = count;
            tr.appendChild(td);
            total += count;
          });

          const totalTd = document.createElement("td");
          totalTd.textContent = total;
          tr.appendChild(totalTd);

          tbody.appendChild(tr);
        });
      });
    }

    // Hard reset button
    async function resetData() {
      const confirmReset = confirm("Are you sure you want to reset ALL button stats? This cannot be undone!");
      if (!confirmReset) return;

      try {
        const response = await fetch("/reset", { method: "POST" });
        if (!response.ok) throw new Error("Failed to reset data");

        alert("All stats have been reset.");
        // Reload stats after reset
        loadStats();
      } catch (err) {
        console.error(err);
        alert("Error resetting data: " + err);
      }
    }

    // Load stats on page load
    window.addEventListener("DOMContentLoaded", loadStats);
  </script>

</body>
</html>
