<!DOCTYPE html>
<html>
<head>
  <title>Button Stats</title>
  <style>
    body { font-family: Arial; padding: 20px; }
    table { border-collapse: collapse; width: 300px; }
    th, td { border: 1px solid #ccc; padding: 8px; }
    th { background: #eee; }
  </style>
</head>
<body>

  <h2>Button Clicks (Last 7 Days)</h2>
  <table>
    <thead>
      <tr>
        <th>Button</th>
        <th>Clicks</th>
      </tr>
    </thead>
    <tbody id="stats-week"></tbody>
  </table>

  <h2>Button Clicks (All Time)</h2>
  <table>
    <thead>
      <tr>
        <th>Button</th>
        <th>Clicks</th>
      </tr>
    </thead>
    <tbody id="stats-all"></tbody>
  </table>

  <script>
    async function loadWeekStats() {
      const res = await fetch("/stats/week");
      const data = await res.json();

      const tbody = document.getElementById("stats-week");
      tbody.innerHTML = "";

      data.forEach(row => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${row.button_id}</td>
          <td>${row.total}</td>
        `;
        tbody.appendChild(tr);
      });
    }
