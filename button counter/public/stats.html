<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Eagle Shop Stats</title>

<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<style>
body { font-family: Roboto, sans-serif; padding:20px; }
h1 { text-align:center; }

.controls { text-align:center; margin-bottom:15px; }
button { padding:8px 14px; margin:5px; cursor:pointer; font-weight:bold; }
.reset { background:#f44336; color:white; border:none; }

table { width:100%; border-collapse:collapse; margin-bottom:30px; }
th, td { border:1px solid #ccc; padding:6px; text-align:center; }
th { background:#eee; }
.current-week { background:#fff59d; font-weight:bold; }

.stock-decreased {
  color: #ef6c00;   /* orange */
  font-weight: bold;
}

.stock-zero {
  color: #c62828;   /* red */
  font-weight: bold;
}

.stock-increased {
  color: #2e7d32;   /* green */
  font-weight: bold;
}

</style>
</head>

<body>

<h1>Eagle Shop Stats</h1>

<div class="controls">
  <button id="prev">⬅ Previous</button>
  <span id="week-label">Week 1</span>
  <button id="next">Next ➡</button><br><br>
  <button id="closeWeek">Close This Week</button>
  <button class="reset" id="reset">Reset ALL Data</button>
  <button id="export">💾 Export to Excel</button>
</div>

<!-- MAIN SALES TABLE -->
<table id="stats-table">
<thead>
<tr>
  <th>Group</th>
  <th>Button</th>
  <th>W1</th><th>W2</th><th>W3</th><th>W4</th><th>W5</th>
  <th>W6</th><th>W7</th><th>W8</th><th>W9</th><th>W10</th>
  <th>Total</th>
  <th>Initial Stock</th>
  <th>Current Stock</th>
</tr>
</thead>
<tbody id="table"></tbody>
</table>

<!-- HORIZONTAL WEEKLY STOCK TABLE -->
<h2>Weekly Remaining Stock</h2>

<table id="stock-table">
<thead>
<tr>
  <th>Button</th>
  <th>W1</th><th>W2</th><th>W3</th><th>W4</th><th>W5</th>
  <th>W6</th><th>W7</th><th>W8</th><th>W9</th><th>W10</th>
</tr>
</thead>
<tbody id="stock-body"></tbody>
</table>

<script>
document.addEventListener("DOMContentLoaded", function () {

const WEEKS = 10;

// ---------------- INITIAL BUTTONS ----------------
const BUTTONS = [
  {name:"Ice Block", group:10},
  {name:"Sit with friend", group:10},
  {name:"Stationery Pack", group:10},
  {name:"Tattoo", group:10},
  {name:"Duty with a teacher", group:30},
  {name:"Game with a friend", group:30},
  {name:"Special chair in class", group:30},
  {name:"Notepad", group:50},
  {name:"Lolly bag", group:50},
  {name:"15 mins computer time", group:50},
  {name:"Morning tea with 3 friends", group:50},
  {name:"Handball", group:75},
  {name:"30 mins computer time", group:75},
  {name:"20 mins computer time with friend", group:75},
  {name:"Lanyard", group:100},
  {name:"Free choice in class", group:100},
  {name:"BYO morning tea with teacher", group:150},
  {name:"Pick a prize", group:150},
  {name:"Mentor in another class", group:150},
  {name:"$2 tuckshop voucher", group:250},
  {name:"Dodgeball for your whole class", group:250},
  {name:"Free play for whole class", group:250},
  {name:"Morning tea with DP", group:300},
  {name:"Games Room (Nintendo Switch)", group:300},
  {name:"400 badge", group:400},
  {name:"$3 tuckshop voucher", group:400},
];

// ---------------- LOAD LOCALSTORAGE ----------------
let dashboard = JSON.parse(localStorage.getItem("dashboard")) || {};
let currentWeek = parseInt(localStorage.getItem("currentWeek")) || 1;
let closedWeeks = JSON.parse(localStorage.getItem("closedWeeks")) || [];
let weeklyStock = JSON.parse(localStorage.getItem("weeklyStock")) || {};

// ---------------- ENSURE ALL BUTTONS EXIST ----------------
BUTTONS.forEach(btn => {
  if (!dashboard[btn.name]){
    dashboard[btn.name] = {
      group: btn.group,
      weeks: new Array(WEEKS).fill(0),
      initialStock: 0,
      remainingStock: 0,
      backorder: 0
    };
  }

  if (!weeklyStock[btn.name]){
    weeklyStock[btn.name] = new Array(WEEKS).fill(null);
  }
});

// ---------------- RENDER MAIN TABLE ----------------
function render() {
  const body = document.getElementById("table");
  body.innerHTML = "";
  document.getElementById("week-label").textContent = `Week ${currentWeek}`;

  const sorted = Object.entries(dashboard).sort((a,b)=>(a[1].group||0)-(b[1].group||0));

  sorted.forEach(([name,data])=>{
    const total = data.weeks.reduce((a,b)=>a+b,0);

    // Determine if stock input should be editable
    const canEditStock = !closedWeeks.includes(currentWeek) || data.remainingStock===0;

    const row = document.createElement("tr");
    row.innerHTML = `
      <td>${data.group || ""}</td>
      <td>${name}</td>
      ${data.weeks.map((v,i)=>
        `<td class="${i===currentWeek-1?'current-week':''}">${v}</td>`
      ).join("")}
      <td>${total}</td>
      <td>
        ${canEditStock ? `<input type="number" min="0" value="${data.initialStock}" style="width:80px" onchange="setStock('${name}', this.value)">` : ""}
      </td>
      <td>${data.remainingStock}</td>
    `;
    body.appendChild(row);
  });

  localStorage.setItem("dashboard", JSON.stringify(dashboard));
  renderStockTable();
}

// ---------------- SET STOCK ----------------
window.setStock = function(name,value){
  const amount = parseInt(value);
  if (isNaN(amount) || amount < 0) return;

  const item = dashboard[name];

  // Handle backorder if stock was negative
  if (item.backorder > 0){
    if (amount >= item.backorder){
      item.remainingStock = amount - item.backorder;
      item.backorder = 0;
    } else {
      item.backorder -= amount;
      item.remainingStock = 0;
    }
  } else {
    item.remainingStock = amount;
  }

  item.initialStock = amount;
  localStorage.setItem("dashboard", JSON.stringify(dashboard));
  render();
};

// ---------------- CLOSE WEEK ----------------
function closeWeek(){
  if (closedWeeks.includes(currentWeek)){
    alert("This week has already been closed.");
    return;
  }

  Object.entries(dashboard).forEach(([name,data])=>{
    const sold = data.weeks[currentWeek-1] || 0;

    if (sold > data.remainingStock){
      const shortage = sold - data.remainingStock;
      data.backorder += shortage;
      data.remainingStock = 0;
    } else {
      data.remainingStock -= sold;
    }

    weeklyStock[name][currentWeek-1] = data.remainingStock;
  });

  closedWeeks.push(currentWeek);

  localStorage.setItem("closedWeeks", JSON.stringify(closedWeeks));
  localStorage.setItem("dashboard", JSON.stringify(dashboard));
  localStorage.setItem("weeklyStock", JSON.stringify(weeklyStock));

  render();
}

// ---------------- RENDER STOCK TABLE ----------------
function renderStockTable(){
  const body = document.getElementById("stock-body");
  body.innerHTML = "";

  const sorted = Object.entries(dashboard).sort((a,b)=>(a[1].group||0)-(b[1].group||0));

  sorted.forEach(([name,data])=>{
    const row = document.createElement("tr");

    const cells = weeklyStock[name].map((v,i)=>{
      return `<td>${v !== null ? v : '-'}</td>`;
    }).join("");

    row.innerHTML = `<td>${name}</td>${cells}`;
    body.appendChild(row);
  });
}

// ---------------- NAVIGATION ----------------
document.getElementById("prev").onclick=function(){
  if(currentWeek>1){
    currentWeek--;
    localStorage.setItem("currentWeek",currentWeek);
    render();
  }
};

document.getElementById("next").onclick=function(){
  if(currentWeek<WEEKS){
    currentWeek++;
    localStorage.setItem("currentWeek",currentWeek);
    render();
  }
};

// ---------------- ADD CLOSE WEEK BUTTON ----------------
const closeBtn=document.createElement("button");
closeBtn.textContent="Close This Week";
closeBtn.onclick=closeWeek;
document.querySelector(".controls").appendChild(closeBtn);

// ---------------- RESET ----------------
document.getElementById("reset").onclick=function(){
  if(!confirm("Delete ALL data?")) return;
  localStorage.clear();
  location.reload();
};

// ---------------- INITIAL RENDER ----------------
render();
</script>


</body>
</html>
