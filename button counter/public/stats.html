<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Eagle Shop Stats</title>

<style>
  body { font-family: Roboto, sans-serif; padding:20px; }
  h1 { text-align:center; }

  .controls { text-align:center; margin-bottom:15px; }
  button { padding:8px 14px; margin:5px; cursor:pointer; font-weight:bold; }
  .reset { background:#f44336; color:white; border:none; }

  table { width:100%; border-collapse:collapse; }
  th, td { border:1px solid #ccc; padding:6px; text-align:center; }
  th { background:#eee; }
  .current-week { background:#fff59d; font-weight:bold; }
</style>
</head>

<body>

<h1>Eagle Shop Stats</h1>

<div class="controls">
  <button id="prev">⬅ Previous</button>
  <span id="week-label">Week 1</span>
  <button id="next">Next ➡</button><br>
  <button class="reset" id="reset">Reset ALL Data</button>
</div>

<table>
<thead>
<tr>
  <th>Group</th><th>Button</th>
  <th>W1</th><th>W2</th><th>W3</th><th>W4</th><th>W5</th>
  <th>W6</th><th>W7</th><th>W8</th><th>W9</th><th>W10</th>
  <th>Total</th>
</tr>
</thead>
<tbody id="table"></tbody>
</table>

<script>
const WEEKS = 10;

let dashboard = JSON.parse(localStorage.getItem("dashboard")) || {};
let currentWeek = parseInt(localStorage.getItem("currentWeek")) || 1;

function render() {
  const body = document.getElementById("table");
  body.innerHTML = "";
  document.getElementById("week-label").textContent = `Week ${currentWeek}`;

  Object.entries(dashboard)
    .sort((a,b)=>parseInt(a[1].group)-parseInt(b[1].group))
    .forEach(([name,data])=>{
      const total = data.weeks.reduce((a,b)=>a+b,0);
      const row = document.createElement("tr");
      row.innerHTML = `
        <td>${data.group}</td>
        <td>${name}</td>
        ${data.weeks.map((v,i)=>`<td class="${i===currentWeek-1?'current-week':''}">${v}</td>`).join("")}
        <td>${total}</td>`;
      body.appendChild(row);
    });
}

document.getElementById("prev").onclick = ()=>{
  if(currentWeek>1){
    currentWeek--;
    localStorage.setItem("currentWeek",currentWeek);
    render();
  }
};

document.getElementById("next").onclick = ()=>{
  if(currentWeek<WEEKS){
    currentWeek++;
    localStorage.setItem("currentWeek",currentWeek);
    render();
  }
};

document.getElementById("reset").onclick = ()=>{
  if(!confirm("Delete ALL data?")) return;
  document.getElementById("reset").onclick = () => {
  if (!confirm("Delete ALL data?")) return;

  const resetTime = Date.now();

  localStorage.setItem("resetTime", resetTime);
  localStorage.removeItem("dashboard");
  localStorage.removeItem("currentWeek");
  localStorage.removeItem("lastWeekUpdate");

  dashboard = {};
  currentWeek = 1;

  render();
  alert("✅ All data has been reset.");
};

  dashboard = {};
  currentWeek = 1;
  localStorage.setItem("currentWeek",1);
  render();
};

render();
</script>

</body>
</html>
