<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Eagle Shop Stats</title>
<style>
body { font-family: Roboto, sans-serif; padding: 20px; }
h1 { text-align: center; margin-bottom: 10px; }
table { border-collapse: collapse; width: 100%; margin-top: 20px; }
th, td { border: 1px solid #ccc; padding: 8px; text-align: center; }
th { background: #eee; }
.current-week { background-color: #ffff99; }
.btn { padding: 8px 12px; margin: 5px; cursor: pointer; }
</style>
</head>
<body>

<h1>Eagle Shop Stats Dashboard</h1>
<div>
  <button class="btn" id="prev-week">⬅ Previous Week</button>
  <span id="current-week">Week 1</span>
  <button class="btn" id="next-week">Next Week ➡</button>
</div>

<table>
<thead>
<tr>
  <th>Group</th>
  <th>Button</th>
  <th>Week 1</th>
  <th>Week 2</th>
  <th>Week 3</th>
  <th>Week 4</th>
  <th>Week 5</th>
  <th>Week 6</th>
  <th>Week 7</th>
  <th>Week 8</th>
  <th>Week 9</th>
  <th>Week 10</th>
  <th>Total</th>
</tr>
</thead>
<tbody id="stats-table"></tbody>
</table>

<script>
const WEEKS = 10;
let currentWeek = parseInt(localStorage.getItem("currentWeek")) || 1;
let dashboard = JSON.parse(localStorage.getItem("dashboard")) || {};

// Sort groups by value
function renderTable() {
  const tbody = document.getElementById("stats-table");
  tbody.innerHTML = "";
  Object.entries(dashboard)
    .sort((a,b)=>parseInt(a[1].group)-parseInt(b[1].group))
    .forEach(([button,data])=>{
      const total = data.weeks.reduce((a,b)=>a+b,0);
      const row = document.createElement("tr");
      row.innerHTML = `
        <td>${data.group}</td>
        <td>${button}</td>
        ${data.weeks.map((v,i)=>`<td ${i===currentWeek-1?'class="current-week"':''}>${v}</td>`).join('')}
        <td>${total}</td>
      `;
      tbody.appendChild(row);
    });
  document.getElementById("current-week").textContent = `Week ${currentWeek}`;
}

// Week navigation
document.getElementById("prev-week").onclick = ()=>{
  if(currentWeek>1) currentWeek--;
  localStorage.setItem("currentWeek", currentWeek);
  renderTable();
};
document.getElementById("next-week").onclick = ()=>{
  if(currentWeek<WEEKS) currentWeek++;
  localStorage.setItem("currentWeek", currentWeek);
  renderTable();
};

// Initial render
renderTable();
</script>

</body>
</html>
