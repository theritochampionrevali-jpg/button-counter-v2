<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Eagle Shop Dashboard</title>
<style>
  body { font-family: Roboto, sans-serif; padding: 20px; }
  table { border-collapse: collapse; width: 100%; margin-bottom: 20px; }
  th, td { border: 1px solid #ccc; padding: 8px; text-align: center; }
  th { background: #eee; }
  .btn { padding: 8px 12px; margin: 5px; cursor: pointer; }
</style>
</head>
<body>

<h1>Eagle Shop Button Stats Dashboard</h1>

<div>
  <button class="btn" id="prev-week">⬅ Previous Week</button>
  <span id="current-week">Week 1</span>
  <button class="btn" id="next-week">Next Week ➡</button>
  <button class="btn" id="reset-btn" style="background:red;color:white;">Reset Dashboard Data</button>
</div>

<table>
<thead>
  <tr>
    <th>Group</th>
    <th>Button</th>
    <th>Week 1</th>
    <th>Week 2</th>
    <th>Week 3</th>
    <th>Week 4</th>
    <th>Week 5</th>
    <th>Week 6</th>
    <th>Week 7</th>
    <th>Week 8</th>
    <th>Week 9</th>
    <th>Week 10</th>
    <th>Total</th>
  </tr>
</thead>
<tbody id="stats-table"></tbody>
</table>

<h2>Buttons</h2>
<div id="buttons-container">
  <!-- Buttons will be dynamically generated here -->
</div>

<script>
const WEEKS = 10;
let currentWeek = parseInt(localStorage.getItem("currentWeek")) || 1;

// Map buttons to groups
const buttonGroups = {
  "Ice Block": "10",
  "Sit with friend": "10",
  "Stationery Pack": "10",
  "Tattoo": "10",

  "Duty with a teacher": "30",
  "Game with a friend": "30",
  "Special chair in class": "30",

  "Notepad": "50",
  "Lolly Bag": "50",
  "15 mins computer time": "50",
  "Morning tea with 3 friends": "50",

  "Handball": "75",
  "30 mins computer time": "75",
  "20 mins computer time with friend": "75",

  "Lanyard": "100",
  "Free choice in class": "100",

  "BYO morning tea with teacher": "150",
  "Pick a prize": "150",
  "Mentor in another class": "150",

  "$2 tuckshop voucher": "250",
  "250 badge": "250",
  "Free play for whole class": "250",

  "Morning Tea with DP": "300",
  "Dodgeball for whole class": "300",

  "400 Badge": "400",
  "$3 tuckshop voucher": "400"
};

// Load dashboard from localStorage or initialize
let dashboard = JSON.parse(localStorage.getItem("dashboard")) || {};

function initButton(button) {
  if (!dashboard[button]) {
    dashboard[button] = {
      group: buttonGroups[button],
      weeks: Array(WEEKS).fill(0)
    };
  }
}

// Initialize all buttons
Object.keys(buttonGroups).forEach(initButton);

// Save dashboard to localStorage
function saveDashboard() {
  localStorage.setItem("dashboard", JSON.stringify(dashboard));
  localStorage.setItem("currentWeek", currentWeek);
}

// Render table
function renderTable() {
  const tbody = document.getElementById("stats-table");
  tbody.innerHTML = "";

  // Sort groups by size ascending
  Object.entries(dashboard)
    .sort((a,b) => parseInt(a[1].group) - parseInt(b[1].group))
    .forEach(([button, data]) => {
      const total = data.weeks.reduce((a,b)=>a+b,0);
      const row = document.createElement("tr");
      row.innerHTML = `
        <td>${data.group}</td>
        <td>${button}</td>
        ${data.weeks.map(v => `<td>${v}</td>`).join("")}
        <td>${total}</td>
      `;
      tbody.appendChild(row);
    });

  document.getElementById("current-week").textContent = "Week " + currentWeek;
}

// Render buttons dynamically
function renderButtons() {
  const container = document.getElementById("buttons-container");
  container.innerHTML = "";
  Object.keys(buttonGroups)
    .sort((a,b) => parseInt(buttonGroups[a]) - parseInt(buttonGroups[b]))
    .forEach(button => {
      const btn = document.createElement("button");
      btn.textContent = button + " (+" + currentWeek + ")";
      btn.className = "btn";
      btn.onclick = () => {
        initButton(button);
        dashboard[button].weeks[currentWeek-1]++;
        saveDashboard();
        renderTable();
      };
      container.appendChild(btn);
    });
}

// Navigation buttons
document.getElementById("prev-week").onclick = () => {
  if (currentWeek > 1) currentWeek--;
  saveDashboard();
  renderTable();
  renderButtons();
};

document.getElementById("next-week").onclick = () => {
  if (currentWeek < WEEKS) currentWeek++;
  saveDashboard();
  renderTable();
  renderButtons();
};

// Reset button
document.getElementById("reset-btn").onclick = () => {
  if (confirm("⚠️ This will permanently reset all data. Are you sure?")) {
    dashboard = {};
    currentWeek = 1;
    saveDashboard();
    renderTable();
    renderButtons();
  }
};

// Initial render
renderTable();
renderButtons();
</script>

</body>
</html>
