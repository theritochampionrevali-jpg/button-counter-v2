<!DOCTYPE html>
<html>
<head>
  <title>Button Stats - Eagle Shop</title>
  <style>
    body {

      padding: 20px;
      background-color: #f7f7f7;
    }

      text-align: center;
      margin-bottom: 30px;
    }

    /* Table styling */
    table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 30px;
      background-color: #fff;
    }

    th, td {
      border: 1px solid #333;
      padding: 8px 12px;
      text-align: center;
    }

    th {
      background-color: #444;
      color: white;
      position: sticky;
      top: 0;
    }

    td.group-name {
      font-weight: bold;
      background-color: #f2f2f2;
    }

    td.button-name {
      text-align: left;
      padding-left: 12px;
    }

    tfoot td {
      font-weight: bold;
      background-color: #eee;
    }

    button.reset {
      padding: 10px 16px;
      background-color: #e74c3c;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }

    button.reset:hover {
      opacity: 0.85;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      overflow-x: auto;
    }
  </style>
</head>
