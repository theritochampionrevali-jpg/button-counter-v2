<script>
const WEEKS = 10;

// ---------------- DATA ----------------
let dashboard = JSON.parse(localStorage.getItem("dashboard")) || {};
let currentWeek = parseInt(localStorage.getItem("currentWeek")) || 1;

let initialStock = parseInt(localStorage.getItem("initialStock")) || 0;
let currentStock = parseInt(localStorage.getItem("currentStock")) || 0;
let stockHistory = JSON.parse(localStorage.getItem("stockHistory")) || [];

// ---------------- RENDER BUTTON TABLE ----------------
function render() {
  const body = document.getElementById("table");
  body.innerHTML = "";

  document.getElementById("week-label").textContent = `Week ${currentWeek}`;
  document.getElementById("current-stock").textContent = currentStock;

  Object.entries(dashboard)
    .sort((a, b) => parseInt(a[1].group) - parseInt(b[1].group))
    .forEach(([name, data]) => {

      // Ensure weeks array exists and has correct length
      if (!data.weeks || data.weeks.length !== WEEKS) {
        data.weeks = new Array(WEEKS).fill(0);
      }

      const total = data.weeks.reduce((a, b) => a + b, 0);

      const row = document.createElement("tr");
      row.innerHTML = `
        <td>${data.group}</td>
        <td>${name}</td>
        ${data.weeks.map((v, i) =>
          `<td class="${i === currentWeek - 1 ? 'current-week' : ''}">${v}</td>`
        ).join("")}
        <td>${total}</td>
      `;

      body.appendChild(row);
    });

  renderStockHistory();
}

// ---------------- RENDER STOCK HISTORY ----------------
function renderStockHistory() {
  const body = document.getElementById("stock-body");
  body.innerHTML = "";

  stockHistory.forEach(entry => {
    const row = document.createElement("tr");
    row.innerHTML = `
      <td>Week ${entry.week}</td>
      <td>${entry.used}</td>
      <td>${entry.before}</td>
      <td>${entry.after}</td>
    `;
    body.appendChild(row);
  });
}

// ---------------- SET INITIAL STOCK ----------------
document.getElementById("set-stock").onclick = () => {
  const value = parseInt(document.getElementById("initial-stock").value);

  if (isNaN(value) || value <= 0) {
    alert("Please enter a valid stock amount.");
    return;
  }

  initialStock = value;
  currentStock = value;

  localStorage.setItem("initialStock", initialStock);
  localStorage.setItem("currentStock", currentStock);

  render();
};

// ---------------- CLOSE WEEK & DEDUCT STOCK ----------------
document.getElementById("calculate-stock").onclick = () => {

  if (currentStock <= 0) {
    alert("No stock remaining.");
    return;
  }

  let weeklyTotal = 0;

  Object.values(dashboard).forEach(data => {
    if (data.weeks && data.weeks[currentWeek - 1]) {
      weeklyTotal += data.weeks[currentWeek - 1];
    }
  });

  if (weeklyTotal === 0) {
    alert("No button clicks recorded this week.");
    return;
  }

  const stockBefore = currentStock;
  const stockAfter = currentStock - weeklyTotal;

  if (stockAfter < 0) {
    alert("Not enough stock remaining!");
    return;
  }

  currentStock = stockAfter;

  stockHistory.push({
    week: currentWeek,
    used: weeklyTotal,
    before: stockBefore,
    after: stockAfter
  });

  localStorage.setItem("currentStock", currentStock);
  localStorage.setItem("stockHistory", JSON.stringify(stockHistory));

  render();
};

// ---------------- WEEK NAVIGATION ----------------
document.getElementById("prev").onclick = () => {
  if (currentWeek > 1) {
    currentWeek--;
    localStorage.setItem("currentWeek", currentWeek);
    render();
  }
};

document.getElementById("next").onclick = () => {
  if (currentWeek < WEEKS) {
    currentWeek++;
    localStorage.setItem("currentWeek", currentWeek);
    render();
  }
};

// ---------------- RESET EVERYTHING ----------------
document.getElementById("reset").onclick = () => {
  if (!confirm("Delete ALL data?")) return;

  localStorage.clear();

  dashboard = {};
  stockHistory = [];
  currentWeek = 1;
  currentStock = 0;
  initialStock = 0;

  localStorage.setItem("currentWeek", 1);

  render();
  alert("✅ All data has been reset.");
};

// ---------------- EXPORT TO EXCEL ----------------
document.getElementById("export").onclick = () => {

  const wb = XLSX.utils.book_new();

  const statsTable = document.getElementById("stats-table");
  const statsSheet = XLSX.utils.table_to_sheet(statsTable);
  XLSX.utils.book_append_sheet(wb, statsSheet, "Button Stats");

  const stockTable = document.getElementById("stock-table");
  const stockSheet = XLSX.utils.table_to_sheet(stockTable);
  XLSX.utils.book_append_sheet(wb, stockSheet, "Stock History");

  XLSX.writeFile(wb, "EagleShopStats.xlsx");
};

// ---------------- INITIAL RENDER ----------------
render();
</script>
