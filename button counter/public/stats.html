<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Button Stats Tracker</title>
  <style>
    body { font-family: Roboto, sans-serif; padding: 20px; }
    table { border-collapse: collapse; width: 100%; margin-bottom: 20px; }
    th, td { border: 1px solid #ccc; padding: 8px; text-align: center; }
    th { background: #eee; }
    button { margin: 5px; padding: 5px 10px; }
    .reset { background: #f44336; color: white; border: none; cursor: pointer; }
  </style>
</head>
<body>

  <h2>Button Click Tracker</h2>

  <div id="button-container"></div>

  <table>
    <thead>
      <tr>
        <th>Group</th>
        <th>Button</th>
        <th>Week 1</th>
        <th>Week 2</th>
        <th>Week 3</th>
        <th>Week 4</th>
        <th>Week 5</th>
        <th>Week 6</th>
        <th>Week 7</th>
        <th>Week 8</th>
        <th>Week 9</th>
        <th>Week 10</th>
        <th>Total</th>
      </tr>
    </thead>
    <tbody id="stats-table"></tbody>
  </table>

  <button class="reset" id="reset-btn">Reset All Data</button>

  <script>
    // --- Configuration ---
    const groups = {
      "Group A": ["Button 1", "Button 2"],
      "Group B": ["Button 3", "Button 4"]
    };
    const weeks = 10;

    // --- Load or initialize data ---
    let stats = JSON.parse(localStorage.getItem("buttonStats")) || {};
    
    // Initialize structure if empty
    for (const group in groups) {
      stats[group] = stats[group] || {};
      groups[group].forEach(btn => {
        stats[group][btn] = stats[group][btn] || Array(weeks).fill(0);
      });
    }

    // --- Render buttons ---
    const container = document.getElementById("button-container");
    for (const group in groups) {
      const groupDiv = document.createElement("div");
      groupDiv.innerHTML = `<strong>${group}</strong>: `;
      groups[group].forEach(btn => {
        const buttonEl = document.createElement("button");
        buttonEl.textContent = btn;
        buttonEl.onclick = () => {
          // Increment current week (week 1 for simplicity)
          stats[group][btn][0] += 1;
          saveAndRender();
        };
        groupDiv.appendChild(buttonEl);
      });
      container.appendChild(groupDiv);
    }

    // --- Save to localStorage and render table ---
    function saveAndRender() {
      localStorage.setItem("buttonStats", JSON.stringify(stats));
      renderTable();
    }

    function renderTable() {
      const tbody = document.getElementById("stats-table");
      tbody.innerHTML = "";

      for (const group in stats) {
        for (const btn in stats[group]) {
          const row = document.createElement("tr");
          const totals = stats[group][btn];
          const totalClicks = totals.reduce((a,b) => a+b, 0);
          row.innerHTML = `
            <td>${group}</td>
            <td>${btn}</td>
            ${totals.map(val => `<td>${val}</td>`).join('')}
            <td>${totalClicks}</td>
          `;
          tbody.appendChild(row);
        }
      }
    }

    // --- Reset button ---
    document.getElementById("reset-btn").onclick = () => {
      if (confirm("Are you sure you want to reset all button data? This cannot be undone.")) {
        localStorage.removeItem("buttonStats");
        // Reset stats object
        for (const group in groups) {
          stats[group] = {};
          groups[group].forEach(btn => {
            stats[group][btn] = Array(weeks).fill(0);
          });
        }
        renderTable();
      }
    };

    // --- Initial render ---
    renderTable();
  </script>

</body>
</html>
