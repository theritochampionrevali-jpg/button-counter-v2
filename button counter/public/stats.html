<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Eagle Shop Stats</title>

<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<style>
body { font-family: Roboto, sans-serif; padding:20px; }
h1 { text-align:center; }

.controls { text-align:center; margin-bottom:15px; }
button { padding:8px 14px; margin:5px; cursor:pointer; font-weight:bold; }
.reset { background:#f44336; color:white; border:none; }

table { width:100%; border-collapse:collapse; margin-bottom:30px; }
th, td { border:1px solid #ccc; padding:6px; text-align:center; }
th { background:#eee; }
.current-week { background:#fff59d; font-weight:bold; }
</style>
</head>

<body>

<h1>Eagle Shop Stats</h1>

<div class="controls">
  <button id="prev">⬅ Previous</button>
  <span id="week-label">Week 1</span>
  <button id="next">Next ➡</button><br><br>
  <button id="closeWeek">Close This Week</button>
  <button class="reset" id="reset">Reset ALL Data</button>
  <button id="export">💾 Export to Excel</button>
</div>

<!-- MAIN SALES TABLE -->
<table id="stats-table">
<thead>
<tr>
  <th>Group</th>
  <th>Button</th>
  <th>W1</th><th>W2</th><th>W3</th><th>W4</th><th>W5</th>
  <th>W6</th><th>W7</th><th>W8</th><th>W9</th><th>W10</th>
  <th>Total</th>
  <th>Initial Stock</th>
  <th>Current Stock</th>
</tr>
</thead>
<tbody id="table"></tbody>
</table>

<!-- HORIZONTAL WEEKLY STOCK TABLE -->
<h2>Weekly Remaining Stock</h2>

<table id="stock-table">
<thead>
<tr>
  <th>Button</th>
  <th>W1</th><th>W2</th><th>W3</th><th>W4</th><th>W5</th>
  <th>W6</th><th>W7</th><th>W8</th><th>W9</th><th>W10</th>
</tr>
</thead>
<tbody id="stock-body"></tbody>
</table>

<script>
document.addEventListener("DOMContentLoaded", function () {

const WEEKS = 10;

let dashboard = JSON.parse(localStorage.getItem("dashboard") || "{}");
let currentWeek = parseInt(localStorage.getItem("currentWeek")) || 1;
let closedWeeks = JSON.parse(localStorage.getItem("closedWeeks") || "[]");
let weeklyStock = JSON.parse(localStorage.getItem("weeklyStock") || "{}");

// ---------------- RENDER ----------------
function render() {

  const body = document.getElementById("table");
  body.innerHTML = "";

  document.getElementById("week-label").textContent = `Week ${currentWeek}`;

  const sorted = Object.entries(dashboard)
    .sort((a, b) => (a[1].group || 0) - (b[1].group || 0));

  sorted.forEach(([name, data]) => {

    if (!data.weeks) data.weeks = new Array(WEEKS).fill(0);
    if (data.initialStock === undefined) data.initialStock = 0;
    if (data.remainingStock === undefined) data.remainingStock = data.initialStock;

    const total = data.weeks.reduce((a,b)=>a+b,0);

    const row = document.createElement("tr");

    row.innerHTML = `
      <td>${data.group || ""}</td>
      <td>${name}</td>

      ${data.weeks.map((v,i)=>
        `<td class="${i===currentWeek-1?'current-week':''}">${v}</td>`
      ).join("")}

      <td>${total}</td>

      <td>
        <input type="number"
          min="0"
          value="${data.initialStock}"
          style="width:70px"
          onchange="setStock('${name}', this.value)">
      </td>

      <td>${data.remainingStock}</td>
    `;

    body.appendChild(row);

  });

  localStorage.setItem("dashboard", JSON.stringify(dashboard));
  renderStockTable();
}

// ---------------- SET STOCK ----------------
window.setStock = function(name, value) {
  const amount = parseInt(value);
  if (isNaN(amount) || amount < 0) return;

  dashboard[name].initialStock = amount;
  dashboard[name].remainingStock = amount;

  localStorage.setItem("dashboard", JSON.stringify(dashboard));
  render();
};

// ---------------- CLOSE WEEK ----------------
function closeWeek() {

  if (closedWeeks.includes(currentWeek)) {
    alert("Week already closed.");
    return;
  }

Object.entries(dashboard).forEach(([name,data])=>{

  const sold = data.weeks[currentWeek-1] || 0;
  const newStock = Math.max(0, data.remainingStock - sold);

  data.remainingStock = newStock;

  if (!weeklyStock[name])
    weeklyStock[name] = new Array(WEEKS).fill("");

  // Only save if not already saved
  if (weeklyStock[name][currentWeek-1] === "" ||
      weeklyStock[name][currentWeek-1] === undefined) {

    weeklyStock[name][currentWeek-1] = newStock;
  }

});

  closedWeeks.push(currentWeek);

  localStorage.setItem("dashboard", JSON.stringify(dashboard));
  localStorage.setItem("weeklyStock", JSON.stringify(weeklyStock));
  localStorage.setItem("closedWeeks", JSON.stringify(closedWeeks));

  render();
}

// ---------------- RENDER HORIZONTAL STOCK TABLE ----------------
function renderStockTable() {

  const body = document.getElementById("stock-body");
  body.innerHTML = "";

  const sorted = Object.entries(dashboard)
    .sort((a, b) => (a[1].group || 0) - (b[1].group || 0));

  sorted.forEach(([name, data]) => {

    if (!weeklyStock[name]) {
      weeklyStock[name] = new Array(WEEKS).fill("");
    }

    let lastKnownStock = data.initialStock || 0;

    const rowData = weeklyStock[name].map((value, index) => {

      // If this week has a saved value, use it
      if (value !== "" && value !== null && value !== undefined) {
        lastKnownStock = value;
        return value;
      }

      // If no saved value but a previous week exists, carry it forward
      return lastKnownStock;

    });

    const row = document.createElement("tr");

    row.innerHTML = `
      <td>${name}</td>
      ${rowData.map(v => `<td>${v}</td>`).join("")}
    `;

    body.appendChild(row);

  });

}


// ---------------- WEEK NAVIGATION ----------------
document.getElementById("prev").onclick = function(){
  if(currentWeek>1){
    currentWeek--;
    localStorage.setItem("currentWeek",currentWeek);
    render();
  }
};

document.getElementById("next").onclick = function(){
  if(currentWeek<WEEKS){
    currentWeek++;
    localStorage.setItem("currentWeek",currentWeek);
    render();
  }
};

document.getElementById("closeWeek").onclick = closeWeek;

// ---------------- RESET ----------------
document.getElementById("reset").onclick = function(){

  if(!confirm("Delete ALL data?")) return;

  localStorage.clear();
  dashboard = {};
  weeklyStock = {};
  closedWeeks = [];
  currentWeek = 1;

  render();
};

// ---------------- EXPORT ----------------
document.getElementById("export").onclick = function(){

  const wb = XLSX.utils.book_new();

  const statsSheet = XLSX.utils.table_to_sheet(
    document.getElementById("stats-table")
  );
  XLSX.utils.book_append_sheet(wb, statsSheet, "Button Stats");

  const stockSheet = XLSX.utils.table_to_sheet(
    document.getElementById("stock-table")
  );
  XLSX.utils.book_append_sheet(wb, stockSheet, "Weekly Stock");

  XLSX.writeFile(wb,"EagleShopStats.xlsx");
};

render();

});
</script>

</body>
</html>
