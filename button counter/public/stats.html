<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Button Stats - Weekly</title>
  <style>
    body { font-family: Roboto, sans-serif; padding: 20px; }
    table { border-collapse: collapse; width: 100%; margin-bottom: 30px; }
    th, td { border: 1px solid #ccc; padding: 8px; text-align: center; }
    th { background: #eee; }
    td.button-name { text-align: left; padding-left: 12px; }
    button.reset {
      padding: 10px 16px;
      background-color: #e74c3c;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }
    button.reset:hover { opacity: 0.85; }
  </style>
</head>
<body>

  <h2>Button Clicks - Weekly Stats</h2>
  <table>
    <thead>
      <tr>
        <th>Group</th>
        <th>Button</th>
        <th>Week 1</th>
        <th>Week 2</th>
        <th>Week 3</th>
        <th>Week 4</th>
        <th>Week 5</th>
        <th>Week 6</th>
        <th>Week 7</th>
        <th>Week 8</th>
        <th>Week 9</th>
        <th>Week 10</th>
        <th>Total</th>
      </tr>
    </thead>
    <tbody id="stats-body">
      <tr><td colspan="13">Loading stats...</td></tr>
    </tbody>
  </table>

  <button class="reset" onclick="resetData()">HARD RESET</button>

  <script>
    async function loadStats() {
      try {
        const res = await fetch("/stats");
        if (!res.ok) throw new Error(`HTTP ${res.status} - ${res.statusText}`);
        const statsData = await res.json();

        const tbody = document.getElementById("stats-body");
        tbody.innerHTML = "";

        statsData.forEach(group => {
          group.buttons.forEach(button => {
            const tr = document.createElement("tr");

            // Group name
            const groupTd = document.createElement("td");
            groupTd.textContent = group.group;
            tr.appendChild(groupTd);

            // Button name
            const buttonTd = document.createElement("td");
            buttonTd.classList.add("button-name");
            buttonTd.textContent = button.name;
            tr.appendChild(buttonTd);

            // Weekly counts
            let total = 0;
            button.weekly.forEach(count => {
              const td = document.createElement("td");
              td.textContent = count;
              tr.appendChild(td);
              total += count;
            });

            // Total column
            const totalTd = document.createElement("td");
            totalTd.textContent = total;
            tr.appendChild(totalTd);

            tbody.appendChild(tr);
          });
        });

      } catch (err) {
        console.error("Failed to load stats:", err);
        const tbody = document.getElementById("stats-body");
        tbody.innerHTML = `<tr><td colspan="13">Failed to load stats data: ${err.message}</td></tr>`;
      }
    }

    async function resetData() {
      const confirmReset = confirm("Are you sure you want to reset ALL button stats? This cannot be undone!");
      if (!confirmReset) return;

      try {
        const res = await fetch("/reset", { method: "POST" });
        if (!res.ok) throw new Error(`HTTP ${res.status} - ${res.statusText}`);
        alert("All stats have been reset.");
        loadStats();
      } catch (err) {
        console.error(err);
        alert("Error resetting data: " + err.message);
      }
    }

    // Load stats on page load
    window.addEventListener("DOMContentLoaded", loadStats);
  </script>

</body>
</html>
