<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Eagle Shop Dashboard</title>
<style>
  body { font-family: Roboto, sans-serif; padding: 20px; }
  table { border-collapse: collapse; width: 100%; margin-bottom: 20px; }
  th, td { border: 1px solid #ccc; padding: 8px; text-align: center; }
  th { background: #eee; }
  .reset { background: #f44336; color: white; border: none; cursor: pointer; padding: 8px 12px; margin-bottom: 20px; }
</style>
</head>
<body>

<h1>Eagle Shop Button Stats Dashboard</h1>
<button class="reset" id="reset-btn">Reset Dashboard Data</button>

<table>
<thead>
  <tr>
    <th>Group</th>
    <th>Button</th>
    <th>Week 1</th>
    <th>Week 2</th>
    <th>Week 3</th>
    <th>Week 4</th>
    <th>Week 5</th>
    <th>Week 6</th>
    <th>Week 7</th>
    <th>Week 8</th>
    <th>Week 9</th>
    <th>Week 10</th>
    <th>Total</th>
  </tr>
</thead>
<tbody id="stats-table"></tbody>
</table>

<script>
const weeks = 10;
let dashboardData = JSON.parse(localStorage.getItem("dashboardData")) || {};

// --- Fetch stats from server ---
async function fetchStats() {
  try {
    const res = await fetch("/stats/week"); // Your JSON endpoint
    const data = await res.json(); 
    // Expected format: [{ group: "10", button: "Ice Block", week: 1, total: 5 }, ...]

    // Clear previous data
    dashboardData = {};

    // Build dynamic groups from fetched data
    data.forEach(entry => {
      const { group, button, week, total } = entry;
      if (!dashboardData[group]) dashboardData[group] = {};
      if (!dashboardData[group][button]) dashboardData[group][button] = Array(weeks).fill(0);
      const index = week - 1;
      if (index >= 0 && index < weeks) dashboardData[group][button][index] = total;
    });

    localStorage.setItem("dashboardData", JSON.stringify(dashboardData));
    renderTable();
  } catch (err) {
    console.error("Error fetching stats:", err);
  }
}

// --- Render table ---
function renderTable() {
  const tbody = document.getElementById("stats-table");
  tbody.innerHTML = "";

  for (const group in dashboardData) {
    for (const btn in dashboardData[group]) {
      const weekCounts = dashboardData[group][btn];
      const total = weekCounts.reduce((a,b) => a+b, 0);
      const row = document.createElement("tr");
      row.innerHTML = `
        <td>${group}</td>
        <td>${btn}</td>
        ${weekCounts.map(v => `<td>${v}</td>`).join('')}
        <td>${total}</td>
      `;
      tbody.appendChild(row);
    }
  }
}

// --- Reset button ---
document.getElementById("reset-btn").onclick = () => {
  if (confirm("Are you sure you want to reset the dashboard data?")) {
    localStorage.removeItem("dashboardData");
    dashboardData = {};
    renderTable();
  }
};

// --- Initial load ---
fetchStats();
</script>

</body>
</html>
