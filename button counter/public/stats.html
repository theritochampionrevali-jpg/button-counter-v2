<!DOCTYPE html>
<html>
<head>
  <title>Weekly Button Stats</title>
  <style>
    body { font-family: Arial; padding: 20px; }
    table { border-collapse: collapse; width: 300px; }
    th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
    th { background: #eee; }
  </style>
</head>
<body>

  <h1>Button Clicks (Last 7 Days)</h1>

  <table>
    <thead>
      <tr>
        <th>Button</th>
        <th>Clicks</th>
      </tr>
    </thead>
    <tbody id="stats"></tbody>
  </table>

  <script>
    async function loadStats() {
      const res = await fetch("/stats/week");
      const data = await res.json();

      const tbody = document.getElementById("stats");
      tbody.innerHTML = "";

      data.forEach(row => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${row.button_id}</td>
          <td>${row.total}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    loadStats();
  </script>

</body>
</html>
