<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Eagle Shop Stats</title>

<!-- Load Roboto font -->
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

<!-- Load SheetJS library for Excel export -->
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<style>
  body { font-family: Roboto, sans-serif; padding:20px; }
  h1 { text-align:center; }

  .controls { text-align:center; margin-bottom:15px; }
  button { padding:8px 14px; margin:5px; cursor:pointer; font-weight:bold; }
  .reset { background:#f44336; color:white; border:none; }

  table { width:100%; border-collapse:collapse; }
  th, td { border:1px solid #ccc; padding:6px; text-align:center; }
  th { background:#eee; }
  .current-week { background:#fff59d; font-weight:bold; }
</style>
</head>

<body>

<h1>Eagle Shop Stats</h1>

<div class="controls">
  <button id="prev">⬅ Previous</button>
  <span id="week-label">Week 1</span>
  <button id="next">Next ➡</button><br><br>
  <button class="reset" id="reset">Reset ALL Data</button>
  <button id="export">💾 Export to Excel</button>
</div>

<table id="stats-table">
<thead>
<tr>
  <th>Group</th>
  <th>Button</th>
  <th>W1</th><th>W2</th><th>W3</th><th>W4</th><th>W5</th>
  <th>W6</th><th>W7</th><th>W8</th><th>W9</th><th>W10</th>
  <th>Total</th>
  <th>Initial Stock</th>
  <th>Remaining Stock</th>
</tr>
</thead>
<tbody id="table"></tbody>
</table>

<h2>Weekly Stock History</h2>

<table id="stock-table">
  <thead>
    <tr>
      <th>Button</th>
      <th>Week</th>
      <th>Remaining Stock</th>
    </tr>
  </thead>
  <tbody id="stock-body"></tbody>
</table>

<script>
document.addEventListener("DOMContentLoaded", function () {

const WEEKS = 10;

let dashboard = JSON.parse(localStorage.getItem("dashboard") || "{}");
let currentWeek = parseInt(localStorage.getItem("currentWeek")) || 1;
let stockHistory = JSON.parse(localStorage.getItem("stockHistory") || "[]");
let closedWeeks = JSON.parse(localStorage.getItem("closedWeeks") || "[]");

// ---------------- RENDER MAIN TABLE ----------------
function render() {

  const body = document.getElementById("table");
  body.innerHTML = "";

  document.getElementById("week-label").textContent = `Week ${currentWeek}`;

  // Sort the buttons by group value in ascending order
  const sortedDashboard = Object.entries(dashboard)
    .sort((a, b) => a[1].group - b[1].group); // Sorting by the 'group' value in ascending order

  sortedDashboard.forEach(([name, data]) => {

    if (!data.weeks) data.weeks = new Array(WEEKS).fill(0);
    if (data.initialStock === undefined) data.initialStock = 0;
    if (data.remainingStock === undefined)
      data.remainingStock = data.initialStock;

    // Calculate the total of all weeks combined
    const total = data.weeks.reduce((a,b) => a + b, 0);

    const row = document.createElement("tr");

    row.innerHTML = `
      <td>${data.group || ""}</td>
      <td>${name}</td>

      ${data.weeks.map((v, i) =>
        `<td class="${i === currentWeek - 1 ? 'current-week' : ''}">${v}</td>`
      ).join("")}

      <td>${total}</td>

      <td>
        <input type="number"
               min="0"
               value="${data.initialStock}"
               style="width:80px"
               onchange="setStock('${name}', this.value)">
      </td>

      <td>${data.remainingStock}</td>
    `;

    body.appendChild(row);
  });

  localStorage.setItem("dashboard", JSON.stringify(dashboard));
  renderStockHistory();
}

// ---------------- SET STOCK ----------------
window.setStock = function(name, value) {
  const amount = parseInt(value);
  if (isNaN(amount) || amount < 0) return;

  dashboard[name].initialStock = amount;
  dashboard[name].remainingStock = amount;

  localStorage.setItem("dashboard", JSON.stringify(dashboard));
  render();
};

// ---------------- CLOSE WEEK ----------------
function closeWeek() {

  // Check if the week has already been closed
  if (closedWeeks.includes(currentWeek)) {
    alert("This week has already been closed.");
    return;
  }

  Object.entries(dashboard).forEach(([name, data]) => {

    const sold = data.weeks[currentWeek - 1] || 0;
    const before = data.remainingStock;
    const after = before - sold;

    // Update the remaining stock for the button
    data.remainingStock = after < 0 ? 0 : after;

    stockHistory.push({
      week: currentWeek,
      button: name,
      remainingStock: data.remainingStock
    });

  });

  closedWeeks.push(currentWeek);
  localStorage.setItem("closedWeeks", JSON.stringify(closedWeeks));
  localStorage.setItem("dashboard", JSON.stringify(dashboard));
  localStorage.setItem("stockHistory", JSON.stringify(stockHistory));

  render();
}

// ---------------- RENDER STOCK HISTORY ----------------
function renderStockHistory() {

  const body = document.getElementById("stock-body");
  body.innerHTML = "";

  // Display remaining stock per item per week
  stockHistory.forEach(entry => {

    const row = document.createElement("tr");

    row.innerHTML = `
      <td>${entry.button}</td>
      <td>Week ${entry.week}</td>
      <td>${entry.remainingStock}</td>
    `;

    body.appendChild(row);
  });
}

// ---------------- WEEK NAVIGATION ----------------
document.getElementById("prev").onclick = function() {
  if (currentWeek > 1) {
    currentWeek--;
    localStorage.setItem("currentWeek", currentWeek);
    render();
  }
};

document.getElementById("next").onclick = function() {
  if (currentWeek < WEEKS) {
    currentWeek++;
    localStorage.setItem("currentWeek", currentWeek);
    render();
  }
};

// ---------------- ADD CLOSE WEEK BUTTON ----------------
const closeBtn = document.createElement("button");
closeBtn.textContent = "Close This Week";
closeBtn.onclick = closeWeek;
document.querySelector(".controls").appendChild(closeBtn);

// ---------------- RESET ----------------
document.getElementById("reset").onclick = function () {
  if (!confirm("Delete ALL data?")) return;

  localStorage.clear();
  dashboard = {};
  stockHistory = [];
  closedWeeks = [];
  currentWeek = 1;
  localStorage.setItem("currentWeek", 1);
  render();
};

// ---------------- EXPORT ----------------
document.getElementById("export").onclick = function () {

  const wb = XLSX.utils.book_new();

  const statsSheet = XLSX.utils.table_to_sheet(
    document.getElementById("stats-table")
  );
  XLSX.utils.book_append_sheet(wb, statsSheet, "Button Stats");

  const stockSheet = XLSX.utils.table_to_sheet(
    document.getElementById("stock-table")
  );
  XLSX.utils.book_append_sheet(wb, stockSheet, "Stock History");

  XLSX.writeFile(wb, "EagleShopStats.xlsx");
};

// ---------------- INITIAL RENDER ----------------
render();

});
</script>

</body>
</html>
